version: "3"

vars:
  BINARY: mcp-proxy
  PKG: ./cmd/mcp-proxy

tasks:
  default:
    desc: List available tasks
    cmd: task --list

  tidy:
    desc: Tidy go.mod/go.sum
    cmds:
      - go mod tidy

  build:
    desc: Build the mcp-proxy binary
    cmds:
      - go build -o {{.BINARY}} {{.PKG}}

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  test:
    desc: Run tests
    cmds:
      - go test ./... -race -cover

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -f {{.BINARY}}

  ci:
    desc: Run the full CI suite (vet, lint, test, build)
    cmds:
      - task: vet
      - task: lint
      - task: test
      - task: build
